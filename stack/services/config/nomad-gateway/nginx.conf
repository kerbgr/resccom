# ResCCOM 1.3-b — glue between .island DNS names and NOMAD's child apps.
#
# NOMAD's admin container manages Kiwix (and any future app) as a sibling
# container on ITS OWN docker network (project-nomad_default), publishing
# each on a host port (Kiwix: 8090) — see ../../nomad/compose.yaml's
# header comment for why that can't be pointed at services_net directly
# without forking NOMAD's own DockerService code. This container is the
# fix: it's the only thing on services_net that knows NOMAD exists at
# all, reached over host.docker.internal (the docker host's own published
# ports), and everything upstream of it (Open5GS, CoreDNS, the UE) stays
# exactly as ignorant of NOMAD as CLAUDE.md's "glue is only networking"
# rule intends.
#
# 2.1-d: maps.island now has its own server block (RFC-0006 D2: the
# Island Console reads its base map tiles from here, "no second map
# stack"). NOMAD's own Maps feature (admin/app/services/map_service.ts)
# produces a real PMTiles file on its bind-mounted storage
# (../../nomad/data/storage/maps/pmtiles/) via its `setup-world-basemap`
# API — no route in NOMAD itself serves that file over HTTP with Range
# support (its own map viewer is behind its React admin UI), so this
# container reads the SAME file directly off the shared bind mount and
# serves it as a plain static file. This is still "reuse, don't bundle a
# second map stack": NOMAD remains the only place tiles are produced and
# managed (its admin UI/API is how an operator downloads a finer-zoom
# regional extract later); this block only serves what NOMAD already
# wrote to disk.
#
# Coupling to watch: the path below assumes NOMAD_DATA_DIR is set to
# ./data (stack/services/nomad/.env) as it is in this repo's own
# deployment — a differently-configured NOMAD_DATA_DIR would need this
# volume's source path updated to match (see ../../compose.yaml's
# nomad-gateway volumes).
server {
    listen 80;
    server_name maps.island;

    location /world.pmtiles {
        alias /usr/share/nginx/pmtiles/world.pmtiles;
        # Console (console.island) fetches tile ranges cross-origin via
        # the PMTiles JS client; nginx's default static-file handling
        # already serves Range requests, these headers just let the
        # browser read the response.
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers Range;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges";
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;

    # library.island / learn.island still resolve to this container (see
    # ../coredns/island.zone) and proxy to Kiwix: only Kiwix (library) is
    # installed as of 1.3-b — Kolibri (learn) is a future NOMAD app, not
    # yet part of this stack.
    location / {
        proxy_pass http://host.docker.internal:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
