# ResCCOM 1.3-c — single-origin proxy for chat.island.
#
# Element Web (config.json's base_url) and Synapse's client API share one
# origin (http://chat.island/, no port) — the standard co-located Matrix
# deployment topology, chosen specifically so the browser never makes a
# cross-origin request and nothing here depends on CORS headers being
# right. matrix-synapse and matrix-element are both plain, unmodified
# upstream containers on the private matrix_net; this is the only piece
# either of them needs to reach services_net through.
server {
    listen 80 default_server;

    location /_matrix {
        proxy_pass http://matrix-synapse:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location /_synapse/client {
        proxy_pass http://matrix-synapse:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://matrix-element:80;
        proxy_set_header Host $host;
    }
}
