# ResCCOM 1.3-c — Synapse secrets template.
#
# Copy to stack/services/data/matrix-synapse/secrets.yaml (gitignored —
# root .gitignore's blanket `data/` rule) and replace every value below.
# registration_shared_secret / macaroon_secret_key / form_secret: any
# long random string (this task's own real values were Synapse's own
# `generate` command's output — the simplest correct way to produce
# them, since they just need to be unpredictable, not a specific format).
# database.args.password must equal stack/services/.env's
# MATRIX_DB_PASSWORD (same credential — see ../../compose.yaml's
# matrix-postgres service and README.md).
registration_shared_secret: "changeme-any-long-random-string"
macaroon_secret_key: "changeme-any-long-random-string"
form_secret: "changeme-any-long-random-string"

database:
  name: psycopg2
  args:
    user: synapse_user
    password: "changeme-match-.env-MATRIX_DB_PASSWORD"
    database: synapse
    host: matrix-postgres
    port: 5432
    cp_min: 5
    cp_max: 10
