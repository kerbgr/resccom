# ResCCOM 1.3-d — talk.island: proxies web's HTTP/HTTPS + WebSocket
# signaling only. jvb (media) and coturn (TURN relay) are NOT behind
# this — see ../../jitsi/compose.yaml's header comment for why a reverse
# proxy can front signaling but never WebRTC's actual UDP media.
#
# TLS is terminated HERE, not on `web` itself (which stays DISABLE_HTTPS=1,
# plain HTTP to this proxy) — not a style choice: browsers refuse to
# expose getUserMedia()/RTCPeerConnection at all on a plain-HTTP origin
# that isn't localhost (the "secure context" restriction — confirmed
# live, see README.md "Verification performed": a headless Chromium
# against http://talk.island showed literally "WebRTC is not available
# in your browser", not a Jitsi-side error). The cert below is
# self-signed (generated once, see README.md "Bring-up") — it satisfies
# the browser's secure-context check but isn't CA-trusted, so a real
# browser shows a one-time warning to click through. That's an honest
# placeholder for real PKI (WBS 3.4, Phase 3), not a security claim —
# see SECURITY.md.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl default_server;
    ssl_certificate     /etc/nginx/talk.island/cert.crt;
    ssl_certificate_key /etc/nginx/talk.island/cert.key;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
