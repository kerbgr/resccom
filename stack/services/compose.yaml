################################################################################
# ResCCOM 1.3-a/1.3-b/1.3-c/1.3-e — Local DNS for the .island zone (with
# a captive-portal-style fallback for everything else), the proxy glue
# that gets library.island to Project NOMAD's Kiwix content,
# chat.island's Matrix homeserver + Element Web, and portal.island's
# landing/status page.
#
# Upstream, unmodified images (see CLAUDE.md "Never fork upstreams"):
#   - coredns/coredns, nginx, postgres, ghcr.io/element-hq/synapse,
#     ghcr.io/element-hq/element-web, python — see README.md "Versions"
#
# services_net (10.46.0.0/24, CLAUDE.md convention) is created by
# stack/core/compose.yaml, not here: UPF is this subnet's router (it's
# already the UE PDU-session gateway, and NATs UE->services traffic to its
# own services_net address), so it owns the network definition. This file
# only attaches service containers to that existing network as `external`
# — bring core up first (island.sh's order; see stack/core/compose.yaml).
#
# matrix_net is different: a private, project-local network (not shared
# with stack/core, not `external`) so Postgres is reachable only by
# Synapse, never by anything else on services_net — the same
# least-exposure shape as stack/core's core_net, just scoped to one
# component instead of the whole core. Only matrix-gateway is dual-homed
# onto services_net, the same role nomad-gateway plays for NOMAD.
#
# `internal: true` (found missing in 3.3-b follow-up 2's review, added
# here): without it this network was still a plain Docker bridge, so
# Docker's own default NAT gave matrix-postgres/synapse/element a real
# route to the WAN despite the "private" intent above — nothing this
# project's own code exercises today needs it (federation is disabled;
# see stack/services/config/matrix-synapse/homeserver.yaml), and
# matrix-gateway keeps its WAN path exactly as before via its separate
# services_net membership.
################################################################################

networks:
  services_net:
    name: resccom_services_net
    external: true
  matrix_net:
    driver: bridge
    internal: true

services:
  dns:
    image: coredns/coredns:1.12.1
    networks:
      services_net:
        ipv4_address: 10.46.0.53
    volumes:
      - ./config/coredns/Corefile:/etc/coredns/Corefile:ro
      - ./config/coredns/island.zone:/etc/coredns/island.zone:ro
    command: -conf /etc/coredns/Corefile
    healthcheck:
      test: ["CMD", "/coredns", "-version"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 1.3-e: portal.island — also what config/coredns/Corefile's `.:5353`
  # fallback block sends every other domain to when WAN is down (see its
  # own comment, and config/portal/server.py's header comment).
  portal:
    image: python:3.12.11-alpine3.21
    networks:
      services_net:
        ipv4_address: 10.46.0.10
    volumes:
      - ./config/portal/server.py:/app/server.py:ro
      # 2.1-b: association_name/operator_contact, rendered from island.yaml
      # by island-init render. Falls back to the pre-2.1-b placeholder text
      # when null (see server.py's load_settings()). 2.1-g: lives under
      # data/ (gitignored) -- a per-deployment output, never tracked;
      # island.sh up renders it fresh on every boot so this bind mount
      # always finds a real file, even on a brand new checkout.
      - ./data/portal/settings.json:/app/settings.json:ro
    command: ["python3", "/app/server.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 1.3-b: library.island / learn.island / maps.island all resolve here
  # (config/coredns/island.zone) — this proxies them to NOMAD's child app
  # containers over the docker host's published ports. See
  # config/nomad-gateway/nginx.conf and ../nomad/compose.yaml's header
  # comment for why this indirection exists instead of a direct route.
  nomad-gateway:
    image: nginx:1.27.5-alpine
    networks:
      services_net:
        ipv4_address: 10.46.0.11
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/nomad-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 2.1-d: the same PMTiles file NOMAD's own Maps feature wrote to its
      # bind-mounted storage (nginx.conf's own header comment explains
      # why this container serves it directly rather than proxying).
      - ./nomad/data/storage/maps/pmtiles:/usr/share/nginx/pmtiles:ro
    healthcheck:
      # 127.0.0.1, not localhost: this image's stock IPv6 listen directive
      # got skipped (see README.md's "Known limitations" — our own
      # default.conf is mounted read-only, so the entrypoint's usual
      # IPv6-listen patch step can't apply), and "localhost" resolves to
      # ::1 first in this image's /etc/hosts, so wget would report
      # unhealthy against a plain IPv4-only nginx that's actually fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 1.3-c: Matrix homeserver backing store. Never touches services_net —
  # see the matrix_net header comment above.
  matrix-postgres:
    image: postgres:16.10-alpine
    networks:
      - matrix_net
    environment:
      # Synapse refuses to start against a non-C-locale Postgres db (see
      # config/matrix-synapse/homeserver.yaml's own references) —
      # POSTGRES_INITDB_ARGS is the official image's documented way to
      # pass locale flags to `initdb` at first startup.
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
      - POSTGRES_DB=synapse
      - POSTGRES_USER=synapse_user
      - POSTGRES_PASSWORD=${MATRIX_DB_PASSWORD}
    volumes:
      - matrix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse_user -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  matrix-synapse:
    image: ghcr.io/element-hq/synapse:v1.160.0
    networks:
      - matrix_net
    volumes:
      # Two separate, non-overlapping mounts instead of layering a
      # single-file mount over a directory mount at the same path —
      # tried that first (config/matrix-synapse/homeserver.yaml onto
      # /data/homeserver.yaml, itself already inside a /data directory
      # mount): Docker Desktop's virtiofs backend refused it ("mounting
      # ... is outside of rootfs"). /config here is committed, non-secret
      # (homeserver.yaml); /data is gitignored (secrets.yaml, the signing
      # key, log config, media_store — see README.md).
      - ./config/matrix-synapse:/config:ro
      - ./data/matrix-synapse:/data
    command: ["run", "-c", "/config/homeserver.yaml", "-c", "/data/secrets.yaml"]
    depends_on:
      matrix-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  matrix-element:
    image: ghcr.io/element-hq/element-web:v1.12.27
    networks:
      - matrix_net
    volumes:
      - ./config/matrix-element/config.json:/usr/share/nginx/html/config.json:ro
    healthcheck:
      # Port 80, not 8080: this image's *shipped* default.conf (visible
      # only by bypassing docker-entrypoint.sh, e.g. `--entrypoint sh`)
      # says 8080, but the entrypoint's own templating rewrites it to 80
      # before nginx actually starts — confirmed live (the port-80 guess
      # was wrong on the first pass here too; see README.md).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # chat.island — see config/matrix-gateway/nginx.conf's header comment
  # for why Element Web and Synapse share this one origin.
  matrix-gateway:
    image: nginx:1.27.5-alpine
    networks:
      services_net:
        ipv4_address: 10.46.0.20
      matrix_net: {}
    volumes:
      - ./config/matrix-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - matrix-synapse
      - matrix-element
    healthcheck:
      # 127.0.0.1, not localhost — same IPv6/::1 reasoning as
      # nomad-gateway's healthcheck above.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2.1-d: console.island — the Island Console (RFC-0006). Reuses
  # island_init directly (see config/console/Dockerfile's header
  # comment) to validate and preview-render edits.
  #
  # 2.1-f hardened the trust boundary here: this container never holds
  # the association's private signing key, never gets the host's Docker
  # socket, and never gets a read-write mount of the repo -- it only
  # edits and validates a *draft* (RFC-0006 D5). Signing, writing
  # island.yaml, rendering, and restarting affected services all happen
  # host-side via `island.sh apply` (see island_init/apply.py); this
  # container's own repo/island.yaml mounts are read-only, used only to
  # display current state and compute preview diffs. A per-boot operator
  # token (island.sh's bootstrap_console_token, written into
  # data/console/operator-token, the one RW mount this container keeps)
  # gates every write endpoint -- see server.py and SECURITY.md's
  # lab-profile register row on console.island.
  console:
    build:
      context: ../..
      dockerfile: stack/services/config/console/Dockerfile
    image: resccom/island-console:2.1-f
    networks:
      services_net:
        ipv4_address: 10.46.0.40
    volumes:
      - ../../island-init/island.yaml:/data/island.yaml:ro
      - ./data/console:/data/console-state
      - ../..:/repo:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  matrix-postgres-data:
