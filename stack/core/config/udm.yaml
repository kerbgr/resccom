################################################################################
# ResCCOM 1.1-a — UDM (Unified Data Management)
# Derived from upstream open5gs/open5gs configs/open5gs/udm.yaml.in (v2.8.0).
# hnet keys are the upstream sample ECIES test keys shipped inside the
# gradiant/open5gs image at /opt/open5gs/etc/open5gs/hnet/ — not secrets,
# and not overridden here (see CLAUDE.md "never commit secrets").
################################################################################
logger:
  file:
    path: /opt/open5gs/var/log/open5gs/udm.log

global:
  max:
    ue: 1024

udm:
  hnet:
    - id: 1
      scheme: 1
      key: /opt/open5gs/etc/open5gs/hnet/curve25519-1.key
    - id: 2
      scheme: 2
      key: /opt/open5gs/etc/open5gs/hnet/secp256r1-2.key
    - id: 3
      scheme: 1
      key: /opt/open5gs/etc/open5gs/hnet/curve25519-3.key
    - id: 4
      scheme: 2
      key: /opt/open5gs/etc/open5gs/hnet/secp256r1-4.key
    - id: 5
      scheme: 1
      key: /opt/open5gs/etc/open5gs/hnet/curve25519-5.key
    - id: 6
      scheme: 2
      key: /opt/open5gs/etc/open5gs/hnet/secp256r1-6.key
  sbi:
    server:
      # 3.3-c v2d: FQDN as the primary listener, default port 80 -- see
      # ausf.yaml.j2's comment for the full reasoning (identical here;
      # found live, keeping explicit 7777 broke SEPP's cross-island
      # forwarding specifically).
      - address: udm.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      nrf:
        - uri: http://nrf.5gc.mnc001.mcc001.3gppnetwork.org
