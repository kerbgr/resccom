################################################################################
# ResCCOM 1.1-a — AUSF (Authentication Server Function)
# Derived from upstream open5gs/open5gs configs/open5gs/ausf.yaml.in (v2.8.0).
################################################################################
logger:
  file:
    path: /opt/open5gs/var/log/open5gs/ausf.log

global:
  max:
    ue: 1024

ausf:
  sbi:
    server:
      # 3.3-c v2d: FQDN as the primary listener, matching upstream's own
      # home-PLMN roaming example (5gc-no-scp-sepp2-001-01.yaml.in) --
      # this is what makes AUSF's own NRF-registered profile carry an
      # FQDN, which is what a foreign PLMN's AMF actually checks before
      # it will route to SEPP instead of dialing direct
      # (ogs_sbi_fqdn_in_vplmn, lib/sbi/context.c:3107). Default port 80,
      # matching upstream exactly -- found live, keeping the explicit
      # 7777 this NF used before broke the *cross-island* path
      # specifically: SEPP's own "arrived home" forwarding reconstructs
      # the target URL from just the FQDN in the 3gpp-Sbi-Target-apiRoot
      # header, with no port (src/sepp/sbi-path.c's `apiroot +
      # request->h.uri`), so it always lands on the SBI client library's
      # own default (80) regardless of what port NRF's own discovery
      # response reported -- direct in-island calls (AUSF->UDM) aren't
      # affected, since those use the full discovered endpoint including
      # its real port.
      - address: ausf.5gc.mnc001.mcc001.3gppnetwork.org
    client:
      nrf:
        - uri: http://nrf.5gc.mnc001.mcc001.3gppnetwork.org
